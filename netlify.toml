[build]
  command = "bash scripts/build.sh"
  publish = "dist"
  # Only the production branch deploys (Netlify's production branch, set in
  # the site's build settings; Colin, 2026-11-06). Merges to main deploy
  # nothing; a release is one PR from main into production. PR and branch
  # builds are skipped (exit 0 = skip) to save Netlify build credits; PRs
  # are still tested by GitHub CI (Colin, 2026-11-03).
  ignore = "if [ \"$CONTEXT\" = \"production\" ]; then exit 1; else exit 0; fi"

# Sentry build plugin config:
# - skipSetCommits: the default sentry-cli `releases set-commits` step fails
#   because Netlify uses a shallow git clone (parent SHAs missing) AND we
#   have no Sentry → GitHub repo integration configured.
# - deployPreviews: skip the plugin entirely on PR previews — we only care
#   about Sentry release tagging on production deploys, and there are no
#   source maps to upload anyway (no bundler in this project).
[[plugins]]
  package = "@sentry/netlify-build-plugin"
  [plugins.inputs]
    skipSetCommits = true
    deployPreviews = false

# Scripts and styles have no version in their names, so browsers must check
# for a new copy on every load (a quick 304 when unchanged). With an hour of
# caching, a browser could run a new page script against an old
# shared/constants.js after a deploy and break.
[[headers]]
  for = "/**/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/**/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/**/*.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/**/*.html"
  [headers.values]
    Cache-Control = "no-cache"

# The desktop app's pages are app.html under other names; like every HTML
# page they must never be served stale (shared/auto-update.js relies on it).
[[headers]]
  for = "/dashboard"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assignments"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/student"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/gradebook"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/observations"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/observations/starters"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/reports"
  [headers.values]
    Cache-Control = "no-cache"

# inject-env puts the Supabase address and a fresh nonce policy into pages.
# It runs on every address except files that are never a page, so Netlify can
# answer a browser's "has this file changed?" with a quick 304
# (docs/plans/caching-plan.md, step 2). Every address that returns HTML must
# still match: the clean routes above have no extension, and nothing here
# ends in .html. A "*" in these URLPatterns crosses "/", so "/*.js" covers
# /shared/data.js too. tests/edge-function-paths.test.js checks every page
# and every shipped file against this list.
[[edge_functions]]
  path = "/*"
  excludedPath = [
    "/*.js",
    "/*.mjs",
    "/*.css",
    "/*.json",
    "/*.webmanifest",
    "/*.map",
    "/*.png",
    "/*.jpg",
    "/*.jpeg",
    "/*.gif",
    "/*.webp",
    "/*.avif",
    "/*.svg",
    "/*.ico",
    "/*.woff",
    "/*.woff2",
    "/*.ttf",
    "/*.otf",
    "/*.pfb",
    "/*.bcmap",
    "/*.icc",
    "/*.wasm",
    "/*.pdf",
    "/*.csv",
    "/*.txt",
    "/vendor/*",
    "/assets/*",
    "/help/img/*",
  ]
  function = "inject-env"

# Root → login
[[redirects]]
  from = "/"
  to = "/login.html"
  status = 200

# Desktop app pages. Each address serves the app shell; teacher/router.js
# draws the page. Keep this list in step with _routes in teacher/router.js
# (tests/app-routes.test.js checks). Netlify matches these with or without
# a trailing slash, and keeps the query string.
[[redirects]]
  from = "/dashboard"
  to = "/teacher/app.html"
  status = 200

[[redirects]]
  from = "/assignments"
  to = "/teacher/app.html"
  status = 200

[[redirects]]
  from = "/student"
  to = "/teacher/app.html"
  status = 200

[[redirects]]
  from = "/gradebook"
  to = "/teacher/app.html"
  status = 200

[[redirects]]
  from = "/observations"
  to = "/teacher/app.html"
  status = 200

[[redirects]]
  from = "/observations/starters"
  to = "/teacher/app.html"
  status = 200

[[redirects]]
  from = "/reports"
  to = "/teacher/app.html"
  status = 200

# The help site. scripts/build-help.mjs writes help/<slug>.html; these give
# each page an address without .html. A real file (index.json, img/…) is
# served as it is, since these rules don't force.
[[redirects]]
  from = "/help"
  to = "/help/index.html"
  status = 200

[[redirects]]
  from = "/help/:slug"
  to = "/help/:slug.html"
  status = 200

# Legacy URL redirects
[[redirects]]
  from = "/app.html"
  to = "/dashboard"
  status = 301

[[redirects]]
  from = "/app"
  to = "/dashboard"
  status = 301

[[redirects]]
  from = "/mobile.html"
  to = "/teacher-mobile/"
  status = 301

[[redirects]]
  from = "/mobile"
  to = "/teacher-mobile/"
  status = 301
