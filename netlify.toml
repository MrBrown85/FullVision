[build]
  command = "bash scripts/build.sh"
  publish = "dist"

# Sentry build plugin config:
# - skipSetCommits: the default sentry-cli `releases set-commits` step fails
#   because Netlify uses a shallow git clone (parent SHAs missing) AND we
#   have no Sentry → GitHub repo integration configured.
# - deployPreviews: skip the plugin entirely on PR previews — we only care
#   about Sentry release tagging on production deploys, and there are no
#   source maps to upload anyway (no bundler in this project).
[[plugins]]
  package = "@sentry/netlify-build-plugin"
  [plugins.inputs]
    skipSetCommits = true
    deployPreviews = false

# Scripts and styles have no version in their names, so browsers must check
# for a new copy on every load (a quick 304 when unchanged). With an hour of
# caching, a browser could run a new page script against an old
# shared/constants.js after a deploy and break.
[[headers]]
  for = "/**/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/**/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/**/*.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/**/*.html"
  [headers.values]
    Cache-Control = "no-cache"

# The desktop app's pages are app.html under other names; like every HTML
# page they must never be served stale (shared/auto-update.js relies on it).
[[headers]]
  for = "/dashboard"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assignments"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/student"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/gradebook"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/observations"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/observations/starters"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/reports"
  [headers.values]
    Cache-Control = "no-cache"

[[edge_functions]]
  path = "/*"
  function = "inject-env"

# Root → login
[[redirects]]
  from = "/"
  to = "/login.html"
  status = 200

# Desktop app pages. Each address serves the app shell; teacher/router.js
# draws the page. Keep this list in step with _routes in teacher/router.js
# (tests/app-routes.test.js checks). Netlify matches these with or without
# a trailing slash, and keeps the query string.
[[redirects]]
  from = "/dashboard"
  to = "/teacher/app.html"
  status = 200

[[redirects]]
  from = "/assignments"
  to = "/teacher/app.html"
  status = 200

[[redirects]]
  from = "/student"
  to = "/teacher/app.html"
  status = 200

[[redirects]]
  from = "/gradebook"
  to = "/teacher/app.html"
  status = 200

[[redirects]]
  from = "/observations"
  to = "/teacher/app.html"
  status = 200

[[redirects]]
  from = "/observations/starters"
  to = "/teacher/app.html"
  status = 200

[[redirects]]
  from = "/reports"
  to = "/teacher/app.html"
  status = 200

# Legacy URL redirects
[[redirects]]
  from = "/app.html"
  to = "/dashboard"
  status = 301

[[redirects]]
  from = "/app"
  to = "/dashboard"
  status = 301

[[redirects]]
  from = "/mobile.html"
  to = "/teacher-mobile/"
  status = 301

[[redirects]]
  from = "/mobile"
  to = "/teacher-mobile/"
  status = 301
