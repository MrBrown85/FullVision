<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 792" width="612" height="792"><style>text{font-family:Helvetica,Arial,sans-serif;fill:#222}.t{font-size:26px;font-weight:700}.s{font-size:14px;fill:#555}.q{font-size:15px}.f{font-size:12px;fill:#777}line{stroke:#bbb;stroke-width:1}</style><rect width="612" height="792" fill="#fff"/><text x="60" y="80" class="t">Cell Theory Reading</text><text x="60" y="106" class="s">Science 8 · Page 1 of 2</text><line x1="60" y1="120" x2="552" y2="120" style="stroke:#222;stroke-width:2"/><text x="60" y="160" class="q">All living things are made of one or more cells.</text><text x="60" y="190" class="q">The cell is the basic unit of life.</text><text x="60" y="220" class="q">All cells come from other cells.</text><line x1="60" y1="260" x2="552" y2="260"/><line x1="60" y1="290" x2="552" y2="290"/><line x1="60" y1="320" x2="552" y2="320"/><line x1="60" y1="350" x2="552" y2="350"/><text x="60" y="740" class="f">Sample page for Demo Mode</text></svg>
