name: CI

on:
  push:
  pull_request:

jobs:
  test-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # Fails when the client calls an RPC the live database doesn't have, or
      # a file in migrations/ was never applied. Skipped until the read-only
      # role's connection string is saved as a secret (see
      # migrations/20261012_ci_schema_reader_role.sql).
      - name: Check the live database matches the repo
        env:
          DATABASE_URL: ${{ secrets.FV_SCHEMA_READER_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::Database drift check skipped: the FV_SCHEMA_READER_URL secret is not set."
            exit 0
          fi
          node scripts/check-db-drift.mjs

      - name: Collect changed files for format check
        id: changed-files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            range="origin/${GITHUB_BASE_REF}...HEAD"
          else
            before="${{ github.event.before }}"
            # Skip the before-sha branch if the SHA is unreachable, which
            # happens after a force-push rewrites history past it. Without
            # this guard the symmetric-difference expression below errors
            # with "Invalid symmetric difference expression" and the job
            # fails on every force-pushed branch.
            if [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "$before" 2>/dev/null; then
              range="${before}...HEAD"
            elif git rev-parse HEAD^ >/dev/null 2>&1; then
              range="$(git rev-parse HEAD^)...HEAD"
            else
              range="HEAD"
            fi
          fi

          git diff -z --name-only --diff-filter=ACMRT "$range" -- '*.js' '*.css' '*.html' '*.json' '*.md' > /tmp/prettier-files.txt

          if [[ -s /tmp/prettier-files.txt ]]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check formatting for changed files
        if: steps.changed-files.outputs.has_files == 'true'
        shell: bash
        run: xargs -0 npx prettier --check < /tmp/prettier-files.txt

  # Browser tests against dist/ served with the production CSP
  # (scripts/e2e-server.mjs) and a fake Supabase (e2e/helpers.js). Not a
  # required check.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright
        run: npx playwright test

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
