<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      name="description"
      content="Learning profile builder and communicator for BC teachers. Track student proficiency, manage curriculum, and generate reports."
    />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />

    <link rel="stylesheet" href="/teacher/styles.css?v=3" />
    <link rel="stylesheet" href="/shared/loading-screen.css" />
    <link rel="stylesheet" href="/teacher/dashboard.css" />
    <link rel="stylesheet" href="/teacher/assignments.css" />
    <link rel="stylesheet" href="/teacher/student.css" />

    <!-- login.css omitted: only needed on login.html, its body{} rules conflict with SPA layout -->
    <script src="/shared/sentry-init.js"></script>
    <script src="/shared/html.js"></script>
    <script src="/shared/link-nav.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <!-- Shown from the first paint until the first page is drawn (router.js). -->
    <div
      id="app-loading"
      class="app-loading"
      role="status"
      aria-label="Loading your classes"
      data-fv-loading="teacher"
    ></div>
    <script src="/shared/loading-screen.js"></script>
    <div id="gb-tooltip" class="u-hidden"></div>
    <div id="dock-mount"></div>
    <div class="page-layout" id="page-layout">
      <div id="sidebar-mount"></div>
      <div class="u-flex-col-fill">
        <div id="page-toolbar-mount"></div>
        <main class="page-main" id="main"></main>
      </div>
    </div>

    <!-- curriculum_data.js (971 KB) is lazy-loaded by loadCurriculumIndex() in gb-data.js -->
    <script>
      // Auto-detect mobile viewport and redirect to mobile experience.
      // Keep localhost on desktop so responsive/debug workflows can inspect the SPA.
      if (
        window.innerWidth <= 768 &&
        localStorage.getItem('td-mobile-pref') !== 'desktop' &&
        location.hostname !== 'localhost'
      ) {
        window.location.replace('/teacher-mobile/');
      }
      window.__ENV = {
        SUPABASE_URL: '__SUPABASE_URL__',
        SUPABASE_KEY: '__SUPABASE_KEY__',
      };
    </script>
    <script src="/vendor/supabase.min.js"></script>
    <script src="/shared/supabase.js"></script>
    <script src="/shared/constants.js"></script>
    <script src="/shared/reporting-term-presets.js"></script>
    <script src="/shared/data-utilities.js"></script>
    <script src="/shared/data.js"></script>
    <script src="/shared/data-roster.js"></script>
    <script src="/shared/data-withdrawn.js"></script>
    <script src="/shared/data-overrides.js"></script>
    <script src="/shared/data-observations.js"></script>
    <script src="/shared/data-term-ratings.js"></script>
    <script src="/shared/data-student-records.js"></script>
    <script src="/shared/data-student-cards.js"></script>
    <script src="/shared/data-demo.js"></script>
    <script src="/shared/data-curriculum-index.js"></script>
    <script src="/shared/offline-queue.js"></script>
    <script src="/shared/auto-update.js"></script>
    <script src="/shared/calc.js"></script>
    <script src="/shared/grade-state.js"></script>
    <script src="/shared/grader.js"></script>
    <script src="/shared/rubric-draft.js"></script>
    <script src="/shared/rubric-checks.js"></script>
    <script src="/shared/core-self.js"></script>
    <script src="/shared/student-view.js"></script>
    <!-- Photos: shrinking and the queue that keeps them (Add Work in the grader) -->
    <script src="/shared/photo-shrink.js"></script>
    <script src="/shared/photo-queue.js"></script>
    <!-- The PDF reader: pdf.js itself is fetched only when a PDF is chosen -->
    <script src="/shared/photo-readers.js"></script>
    <!-- Pictures of student work on the Work Wall and the Work tab -->
    <script src="/shared/work-thumbs.js"></script>
    <!-- Mark Up: drawing over a page of student work (S9) -->
    <script src="/shared/markup-draw.js"></script>
    <script src="/s/page-view.js"></script>
    <script src="/teacher/ui.js"></script>
    <!-- seed-data.js (113KB) lazy-loaded by loadSeedIfNeeded() — only fetched for new accounts -->
    <!-- Submodules (loaded before their parent page modules) -->
    <script src="/teacher/report-scores.js"></script>
    <script src="/teacher/drafts-before-print.js"></script>
    <script src="/teacher/report-blocks.js"></script>
    <script src="/teacher/comment-realiser.js"></script>
    <script src="/teacher/comment-lint.js"></script>
    <script src="/shared/bank-comment.js"></script>
    <script src="/teacher/comment-bank.js"></script>
    <script src="/teacher/comment-personal.js"></script>
    <!-- vendor/qrcode.js loads the first time slips or cards are printed:
         QrSlips.printSheet waits for it (withScripts in router.js). -->
    <script src="/shared/questionnaire-templates.js"></script>
    <script src="/teacher/questionnaires.js"></script>
    <script src="/teacher/qr-slips.js"></script>
    <script src="/teacher/cm-questionnaires.js"></script>
    <script src="/teacher/student-cards.js"></script>
    <script src="/teacher/preview-student.js"></script>
    <script src="/teacher/cm-student-page.js"></script>
    <script src="/teacher/student-voice.js"></script>
    <script src="/teacher/learner-profile.js"></script>
    <script src="/shared/backup-restore.js"></script>
    <script src="/teacher/cm-roster-file.js"></script>
    <script src="/teacher/cm-block-picker.js"></script>
    <script src="/teacher/dash-class-manager.js"></script>
    <script src="/teacher/dash-overview.js"></script>
    <script src="/teacher/dash-observations.js"></script>
    <script src="/teacher/dash-student-cards.js"></script>
    <script src="/teacher/dash-insights.js"></script>
    <script src="/teacher/assign-collab.js"></script>
    <script src="/teacher/assessment-copy.js"></script>
    <script src="/teacher/factor-field.js"></script>
    <script src="/teacher/class-results.js"></script>
    <script src="/teacher/export-all.js"></script>
    <script src="/teacher/rubric-guard.js"></script>
    <script src="/teacher/obs-capture.js"></script>
    <script src="/teacher/obs-card.js"></script>
    <script src="/teacher/student-evidence.js"></script>
    <script src="/teacher/competency-evidence.js"></script>
    <script src="/teacher/work-wall.js"></script>
    <script src="/teacher/student-overrides.js"></script>
    <script src="/teacher/rubric-print.js"></script>
    <script src="/teacher/competency-wording.js"></script>
    <!-- grades-print.js and grading-setup-copy.js load the first time Print Grades
         or Copy Grading Setup is pressed, rubric-library.js and rubric-bank.js
         when Assignments is first opened: _onDemand in router.js. -->
    <!-- Page modules -->
    <script src="/teacher/page-dashboard.js"></script>
    <script src="/teacher/markup.js"></script>
    <script src="/teacher/page-assignments.js"></script>
    <script src="/teacher/assign-descriptor-bar.js"></script>
    <script src="/teacher/assign-competency-picker.js"></script>
    <script src="/teacher/page-student.js"></script>
    <script src="/teacher/student-edit-dialog.js"></script>
    <script src="/teacher/student-groups.js"></script>
    <script src="/teacher/page-gradebook.js"></script>
    <script src="/teacher/gradebook-chrome.js"></script>
    <script src="/teacher/gradebook-csv.js"></script>
    <script src="/teacher/page-observations.js"></script>
    <script src="/teacher/page-starters.js"></script>
    <!-- Reports and its own scripts (report-sheets.js to page-reports.js) load when
         Reports is first opened: _onDemand in router.js. -->
    <script src="/teacher/router.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      }
    </script>
  </body>
</html>
